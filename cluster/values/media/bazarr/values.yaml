---
defaultPodOptions:
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: "OnRootMismatch"
    supplementalGroups:
      - 65539

controllers:
  main:
    type: deployment
    containers:
      bazarr:
        image:
          repository: ghcr.io/home-operations/bazarr
          tag: 1.6.0
          pullPolicy: IfNotPresent
        env:
          - name: POSTGRES_ENABLED
            value: true
          - name: POSTGRES_HOST
            value: psql.raymol.com
          - name: POSTGRES_PORT
            value: 5432
          - name: POSTGRES_DATABASE
            value: bazarr
          - name: POSTGRES_USERNAME
            valueFrom:
              secretKeyRef:
                name: bazarr-secret
                key: psql_username
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: bazarr-secret
                key: psql_pw
service:
  main:
    controller: main
    ports:
      http:
        port: 6767


route:
  main:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - "bazarr.raymol.com"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: http
        timeouts:
          request: 120s
persistence:
  config:
    existingClaim: bazarr-conf
    globalMounts:
      - path: /config
  torrent:
    type: nfs
    server: 10.20.0.21
    path: /mnt/tank/torrent
    globalMounts:
      - path: /torrent
  tmp:
    type: emptyDir
