---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secret
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  data:
    - secretKey: password
      remoteRef:
        key: kv/database/postgres/harbor
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: kv/database/redis
        property: password
    - secretKey: OIDC_CONFIG
      remoteRef:
        key: kv/apps/harbor
        property: OIDC_CONFIG