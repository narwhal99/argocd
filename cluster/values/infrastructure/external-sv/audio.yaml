apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ext-moodle-raspi
spec:
  endpoints:
    - fqdn:
        hostname: raspi.raymol.com
        port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ext-moodle-raspi
spec:
  parentRefs:
  - name: gateway-internal-eg
    namespace: gateway-envoy
  hostnames:
  - "radio.raymol.com"
  rules:
  - backendRefs:
    - name: ext-moodle-raspi
      port: 8080
      group: gateway.envoyproxy.io
      kind: Backend

