apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-backup-secret
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  data:
    - secretKey: access_key
      remoteRef:
        key: kv/database/s3/argowf
        property: access_key
    - secretKey: access_secret
      remoteRef:
        key: kv/database/s3/argowf
        property: access_secret
