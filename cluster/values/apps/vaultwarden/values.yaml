controllers:
    main:
      type: deployment
      containers:
        vaultwarden:
          image:
            repository: vaultwarden/server
            tag: 1.37.0
            pullPolicy: IfNotPresent
          env:
            - name: DOMAIN
              value: "https://vw.raymol.com"
            - name: SSO_ENABLED
              value: true
            - name: SSO_AUTHORITY
              value: "https://auth.raymol.com/application/o/vaultwarden/"
            - name: SSO_SCOPES
              value: "email profile offline_access"
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: false
            - name: SSO_CLIENT_CACHE_EXPIRATION
              value: 0
            - name: SSO_ONLY
              value: true
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: true
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vw-secrets
                  key: oidc-client-id
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vw-secrets
                  key: oidc-client-secret

service:
  # Configure a service for the main application
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 80


route:
  internal:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - "vw.raymol.com"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: http

persistence:
  data:
    existingClaim: vaultwarden
    advancedMounts:
      main:
        vaultwarden:
        - path: /data
          subPath: data