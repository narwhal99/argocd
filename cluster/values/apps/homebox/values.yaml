controllers:
    main:
      type: deployment
      containers:
        homebox:
          image:
            repository: ghcr.io/sysadminsmedia/homebox
            tag: 0.26.2
            pullPolicy: IfNotPresent
          env:
            - name: HBOX_OIDC_ENABLED
              value: true
            - name: HBOX_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: homebox-secrets
                  key: oidc-client-id
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homebox-secrets
                  key: oidc-client-secret
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: homebox-secrets
                  key: auth-api-key-pepper
            - name: HBOX_OIDC_ISSUER_URL
              value: https://auth.raymol.com/application/o/homebox/
            - name: HBOX_OPTIONS_TRUST_PROXY
              value: true
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 7745


route:
  internal:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - "box.raymol.com"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: http

persistence:
  data:
    existingClaim: homebox
    advancedMounts:
      main:
        homebox:
        - path: /data
          subPath: data