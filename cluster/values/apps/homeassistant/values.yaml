controllers:
    main:
      type: deployment
      containers:
        esphome:
          image:
            repository: esphome/esphome
            tag: 2026.9.1
        homeassistant:
          image:
            repository: homeassistant/home-assistant
            tag: 2026.10.1
            pullPolicy: IfNotPresent
          env:
            - name: DNS_SERVER_DOMAIN
              value: hass.raymol.com
service:
  homeassistant:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8123
  esphome:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 6052

route:
  homeassistant:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - "hass.raymol.com"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: homeassistant
            port: http
  esphome:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - "esphome.raymol.com"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: esphome
            port: http


persistence:
  homeassistant:
    existingClaim: homeassistant-config
    advancedMounts:
      main:
        homeassistant:
          - path: /config
  esphome:
    existingClaim: homeassistant-config
    advancedMounts:
      main:
        esphome:
          - path: /config
            subPath: esphome
