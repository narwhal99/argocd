apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  data:
    - secretKey: psql-user
      remoteRef:
        key: kv/database/postgres/n8n
        property: username
    - secretKey: psql-password
      remoteRef:
        key: kv/database/postgres/n8n
        property: password
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: kv/apps/n8n
        property: encryptkey
    - secretKey: redis-password
      remoteRef:
        key: kv/database/redis
        property: password
    - secretKey: N8N_HOST
      remoteRef:
        key: kv/apps/n8n
        property: N8N_HOST
    - secretKey: N8N_PORT
      remoteRef:
        key: kv/apps/n8n
        property: N8N_PORT
    - secretKey: N8N_PROTOCOL
      remoteRef:
        key: kv/apps/n8n
        property: N8N_PROTOCOL