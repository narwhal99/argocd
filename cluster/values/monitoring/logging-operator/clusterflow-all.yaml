apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterFlow
metadata:
  name: clusterflow-all
spec:
  filters:
    - parser:
        parse:
          type: json
        emit_invalid_record_to_error: false
        reserve_data: true
  match:
    - select: {}
  globalOutputRefs:
    - clusteroutput-loki
