global:
  objstore:
    createSecret: false
    secretName: "thanos-objectstore-secret"
    secretKey: "objstore.yml"
  serviceMonitor:
    enabled: true
    namespace: "monitoring"
  thanosRules:
    enabled: true
    namespace: "monitoring"

bucket:
  enabled: true
  bucketweb:
    enabled: true
    httpRoute:
      enabled: true
      parentRefs:
        - kind: Gateway
          name: gateway-internal-eg
          namespace: gateway-envoy
      hostnames:
        - thanos-bucket.raymol.com

storegateway:
  enabled: true
  replicaCount: 1
  httpRoute:
    enabled: true
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - thanos-storegateway.raymol.com
  persistence:
    enabled: true
    storageClass: "longhorn-cache"
    size: 10Gi


compactor:
  enabled: true
  replicaCount: 1
  retention:
    resolutionRaw: 30d
    resolution5m: 60d
    resolution1h: 90d
  httpRoute:
    enabled: true
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - thanos-compactor.raymol.com
  persistence:
    enabled: true
    existingClaim: "thanos-compactor-data-ssd"

query:
  enabled: true
  replicaCount: 1
  httpRoute:
    enabled: true
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - thanos-query.raymol.com
  replicaLabel:
    - replica
  endpoints:
    autogen:
      enabled: true
    static:
      - dnssrv+_grpc._tcp.prometheus-operated.monitoring.svc.cluster.local

queryFrontend:
  enabled: true
  replicaCount: 1
  httpRoute:
    enabled: true
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - thanos-queryfrontend.raymol.com

receive:
  mode: standalone
  replicaCount: 3
  httpRoute:
    enabled: true
    parentRefs:
      - kind: Gateway
        name: gateway-internal-eg
        namespace: gateway-envoy
    hostnames:
      - thanos-receive.raymol.com
  persistence:
    enabled: true
    storageClass: "longhorn-cache"
    size: 10Gi
