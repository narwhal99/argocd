apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: externalsv
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:narwhal99/argocd.git
    path: cluster/values/infrastructure/external-sv/
    targetRevision: master
    ref: repo
  destination:
    name: in-cluster
    namespace: external-sv
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
