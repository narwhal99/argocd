apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firefly
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - chart: firefly-iii-stack
    repoURL: https://firefly-iii.github.io/kubernetes
    targetRevision: 0.10.2
    helm:
      valueFiles:
      - $repo/cluster/values/apps/firefly/values.yaml
      releaseName: firefly
  - repoURL: git@github.com:narwhal99/argocd.git
    path: cluster/values/apps/firefly
    targetRevision: master
    ref: repo
  destination:
    name: in-cluster
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy